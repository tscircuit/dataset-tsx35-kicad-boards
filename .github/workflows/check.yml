name: Check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: bun run build examples/b03-ftdi-jtag.circuit.tsx --site --routing-disabled --ignore-placement-drc
      - uses: actions/upload-artifact@v4
        with:
          name: dataset-tsx35-kicad-boards-html
          path: dist/
